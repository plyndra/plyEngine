name: Release

# Builds, tests and packages plyEngine on every OS when a version tag is
# pushed, then publishes the artifacts to the GitHub Release. The release is
# only created if the PWA build, all three platform builds, their ctest
# suites, and the Linux headless --verify checks pass (the M7 evidence gate).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # One PWA build shared by every platform, so packaging never depends on a
  # per-runner Node toolchain and all three archives ship identical assets.
  pwa:
    name: Companion PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build PWA
        run: |
          cd companion
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: companion-pwa
          path: companion/dist
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs: [pwa]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            container: ubuntu:22.04
          - os: windows-latest
            platform: windows-x86_64
            container:
          - os: macos-latest
            platform: macos-arm64
            container:
    runs-on: ${{ matrix.os }}
    # Linux binaries are built inside a pinned Ubuntu 22.04 container so they
    # link against glibc 2.35 (symbols <= 2.34) and run on Debian 12+ /
    # Ubuntu 22.04+. Building on the bare ubuntu-latest runner produced
    # binaries that demanded glibc 2.43 and failed on every current LTS distro.
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential git python3 python3-pip python3-jinja2 \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libxss-dev libxfixes-dev \
            libxpresent-dev libxshmfence-dev libxtst-dev \
            xvfb fonts-dejavu-core libgl1-mesa-dri libglx-mesa0
          # Ubuntu 22.04 ships CMake 3.22; the project needs 3.24+.
          python3 -m pip install --upgrade cmake

      - name: Install Python deps (glad codegen)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          # glad runs whatever interpreter CMake's FindPython resolves,
          # which is not necessarily the `python` on PATH — expose jinja2
          # to *all* interpreters via PYTHONPATH.
          PY="$(command -v python3 || command -v python)"
          "$PY" -m pip install --target "$GITHUB_WORKSPACE/.ci-pylib" jinja2
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.ci-pylib" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: companion-pwa
          path: companion/dist

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify demos (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a ./build/ply_hello --frames 3 --verify
          xvfb-run -a ./build/ply_ecs --frames 60 --verify
          xvfb-run -a ./build/ply_assets --frames 5 --verify --assets tests/data
          xvfb-run -a ./build/ply_physics --frames 120 --debug --verify
          xvfb-run -a ./build/ply_tutorial --frames 240 --verify
          xvfb-run -a ./build/ply_companion --frames 1800 --verify --no-mdns --web companion/dist

      - name: Check binary glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          # A binary that needs a newer glibc than the oldest supported distro
          # is a packaging bug, not a warning: assert the floor explicitly.
          max=$(objdump -T build/ply_tutorial | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          printf '%s\n' "2.34" "$max" | sort -uV | tail -1 | grep -qx "2.34" \
            || { echo "::error::binary requires glibc $max (> 2.34 floor)"; exit 1; }

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="plyEngine-${TAG}-${{ matrix.platform }}"
          mkdir -p "dist/${PKG}/companion" "dist/${PKG}/docs"

          BIN=build
          if [ -d build/Release ]; then BIN=build/Release; fi
          for exe in ply_hello ply_ecs ply_assets ply_physics ply_companion ply_tutorial; do
            if [ -f "$BIN/$exe.exe" ]; then
              cp "$BIN/$exe.exe" "dist/${PKG}/"
            else
              cp "$BIN/$exe" "dist/${PKG}/"
            fi
          done

          cp -r companion/dist/. "dist/${PKG}/companion/"
          cp -r docs/. "dist/${PKG}/docs/"
          cp README.md LICENSE CHANGELOG.md CONTRIBUTING.md "dist/${PKG}/"

          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command \
              "Compress-Archive -Path 'dist/${PKG}' -DestinationPath 'dist/${PKG}.zip' -Force"
          else
            tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  source:
    name: Source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source at the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="plyEngine-${TAG}/" \
            -o "plyEngine-${TAG}-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: package-source
          path: plyEngine-*-source.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the built archives: the companion-pwa artifact's flat files
          # must not leak onto the releases page as standalone assets.
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # v1.0.0-alpha.N is a semver prerelease: flag it so GitHub does not
          # advertise it as the latest stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Prebuilt demo binaries (Windows / Linux / macOS), the built
            companion PWA and a source tarball are attached.

            The Linux binaries are built against glibc 2.35 (Ubuntu 22.04)
            and run on Debian 12+, Ubuntu 22.04+ and equivalent.

            See `CHANGELOG.md` inside the package for the full list of
            changes and known limitations. Build-from-source instructions:
            `docs/BUILDING.md`.
