name: CI

on:
  push:
  pull_request:

jobs:
  sanitizers:
    name: ASan + UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libxss-dev libxfixes-dev \
            libxpresent-dev libxshmfence-dev libxtst-dev \
            fonts-dejavu-core

      - name: Configure (sanitized)
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DPLY_SANITIZE=ON

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Test under ASan/UBSan
        run: ctest --test-dir build-asan --output-on-failure

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libxss-dev libxfixes-dev \
            libxpresent-dev libxshmfence-dev libxtst-dev \
            xvfb fonts-dejavu-core


      - name: Build companion PWA
        run: |
          cd companion
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build
          cd ..
        if: runner.os == 'Linux'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Release readiness (version, API drift, links)
        if: runner.os == 'Linux'
        run: |
          # Mechanical half of the beta-soak criteria in docs/ROADMAP.md: the
          # frozen public API may only change additively, the version must
          # agree with the CHANGELOG, and doc links must resolve.
          git fetch --tags --force --quiet
          scripts/release-check.sh --build build

      - name: Install and consume the package (find_package)
        shell: bash
        run: |
          # Guards the installed SDK: cmake --install must produce a prefix a
          # consumer can find and link. This is the check that would catch an
          # export regression before an outside user hits it.
          SDK="$RUNNER_TEMP/plysdk"
          cmake --install build --config Release --prefix "$SDK"

          CON="$RUNNER_TEMP/consumer"
          mkdir -p "$CON"
          cd "$CON"
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.24)
          project(consumer LANGUAGES C CXX)
          find_package(plyEngine CONFIG REQUIRED)
          add_executable(mygame main.cpp)
          target_link_libraries(mygame PRIVATE plyEngine::plyEngine)
          CMAKE
          cat > main.cpp <<'CPP'
          #include "plyEngine/App.hpp"
          #include "plyEngine/Version.hpp"
          #include <cstdio>
          int main() {
              ply::World world;
              const ply::Entity e = world.spawn();
              std::printf("plyEngine %s entities=%zu\n", ply::kVersion,
                          world.entityCount());
              return world.alive(e) ? 0 : 1;
          }
          CPP
          cmake -B b -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$SDK"
          cmake --build b --config Release

          # Run it (multi-config generators put the binary in a subdirectory).
          EXE=$(find b -name mygame -o -name mygame.exe | head -1)
          echo "running $EXE"
          "$EXE" | tee out.txt
          # Version-agnostic on purpose: read the version out of the installed
          # header and require the consumer to report exactly that. Hardcoding
          # "1.0.0-beta" here is what turned the 1.0.0 tag red - the same
          # mistake release.yml already made once.
          EXPECTED=$(sed -n 's/.*kVersion = "\([^"]*\)".*/\1/p' \
                     "$SDK/include/plyEngine/Version.hpp")
          [ -n "$EXPECTED" ] || { echo "::error::no kVersion in installed header"; exit 1; }
          echo "installed kVersion: $EXPECTED"
          grep -Fq "plyEngine $EXPECTED entities=1" out.txt \
            || { echo "::error::consumer did not report $EXPECTED"; exit 1; }

      - name: Run hello example (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_hello --frames 3 --verify --screenshot /tmp/ply_ci.bmp

      - name: Run ECS demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_ecs --frames 60 --verify

      - name: Run assets demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_assets --frames 5 --verify --assets tests/data

      - name: Run physics demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_physics --frames 120 --debug --verify

      - name: Run companion platformer demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_companion --frames 1800 --no-mdns --web companion/dist --verify

      - name: Run scripting demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_scripting --frames 240 --verify

      - name: Run tutorial demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_tutorial --frames 240 --verify

      # The v1.0.0 archives shipped demos that closed their window in under a
      # second: every gate above passes --frames, so none of them could see it,
      # and a downloaded `./ply_companion` died before a phone could join. Run
      # each demo with *no* flags and require it to still be alive afterwards.
      - name: Demos stay open with no flags
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          failed=0
          for exe in ply_hello ply_ecs ply_assets ply_physics ply_tutorial \
                     ply_scripting ply_companion; do
            # "|| code=$?" is load-bearing: Actions runs this with bash -e, so a
            # bare `timeout` would abort the whole step on its first 124 -- the
            # very status this gate treats as success. That made this step fail
            # on every tip it ever ran on (found 2026-11-10).
            code=0
            LIBGL_ALWAYS_SOFTWARE=1 timeout 4 xvfb-run -a "./build/$exe" --no-mdns \
              >/dev/null 2>&1 || code=$?
            if [ "$code" -ne 124 ]; then
              echo "::error::$exe exited with code $code instead of staying open"
              failed=1
            else
              echo "alive after 4s: $exe"
            fi
          done
          exit "$failed"
