name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libxss-dev libxfixes-dev \
            libxpresent-dev libxshmfence-dev libxtst-dev \
            python3-jinja2 xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run hello example (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_hello --frames 3 --verify --screenshot /tmp/ply_ci.bmp
