name: CI

on:
  push:
  pull_request:

jobs:
  sanitizers:
    name: ASan + UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libxss-dev libxfixes-dev \
            libxpresent-dev libxshmfence-dev libxtst-dev \
            python3-jinja2 fonts-dejavu-core

      - name: Configure (sanitized)
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DPLY_SANITIZE=ON

      - name: Build
        run: cmake --build build-asan -j"$(nproc)"

      - name: Test under ASan/UBSan
        run: ctest --test-dir build-asan --output-on-failure

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libxss-dev libxfixes-dev \
            libxpresent-dev libxshmfence-dev libxtst-dev \
            python3-jinja2 xvfb fonts-dejavu-core

      - name: Install Python deps (glad codegen)
        if: runner.os != 'Linux'
        run: python -m pip install jinja2

      - name: Build companion PWA
        run: |
          cd companion
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build
          cd ..
        if: runner.os == 'Linux'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run hello example (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_hello --frames 3 --verify --screenshot /tmp/ply_ci.bmp

      - name: Run ECS demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_ecs --frames 60 --verify

      - name: Run assets demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_assets --frames 5 --verify --assets tests/data

      - name: Run physics demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_physics --frames 120 --debug --verify

      - name: Run companion platformer demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_companion --frames 1800 --no-mdns --web companion/dist --verify

      - name: Run tutorial demo (Linux, headless, verified)
        if: runner.os == 'Linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./build/ply_tutorial --frames 240 --verify
