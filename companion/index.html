<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>plyEngine controller</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <section id="join" class="panel">
        <h1>plyEngine</h1>
        <p class="hint">Enter the room code shown on the screen</p>
        <input
          id="room-input"
          inputmode="latin"
          autocapitalize="characters"
          autocomplete="off"
          spellcheck="false"
          maxlength="8"
          placeholder="CODE"
        />
        <input
          id="name-input"
          autocomplete="off"
          spellcheck="false"
          maxlength="24"
          placeholder="Your name"
        />
        <button id="join-button">Join</button>
        <p id="join-error" class="error" role="alert"></p>
      </section>

      <section id="pad" class="hidden">
        <div class="status">
          <span id="player-label">Player</span>
          <span id="link-state" class="dot"></span>
        </div>
        <div class="controls">
          <div class="dpad">
            <button class="dir up" data-dir="up" aria-label="Up">&#9650;</button>
            <button class="dir left" data-dir="left" aria-label="Left">&#9664;</button>
            <button class="dir right" data-dir="right" aria-label="Right">&#9654;</button>
            <button class="dir down" data-dir="down" aria-label="Down">&#9660;</button>
          </div>
          <div class="actions">
            <button id="btn-b" class="action b" aria-label="B">B</button>
            <button id="btn-a" class="action a" aria-label="A">A</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
